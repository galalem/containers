name: Build & Push Images

on:
  workflow_dispatch:
    inputs:
      container:
        type: choice
        required: true
        description: Which image to build (or 'all')?
        default: all
        options:
          - all
          - laravel
          - nginx
      version:
        type: string
        required: false
        description: Optional version filter (e.g. 8.4). Omit to build every version.
      variant:
        type: string
        required: false
        description: Optional variant filter (e.g. fpm-alpine). Omit to build every variant.
  push:
    branches: [main]
    paths:
      - 'galalem/**'
      - '.github/workflows/build.yaml'
  schedule:
    # Weekly rebuild picks up base-image CVEs without a code change.
    - cron: '0 6 * * 1'

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      empty: ${{ steps.build.outputs.empty }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        name: Build matrix from versions.json
        env:
          IN_CONTAINER: ${{ github.event.inputs.container }}
          IN_VERSION: ${{ github.event.inputs.version }}
          IN_VARIANT: ${{ github.event.inputs.variant }}
        run: |
          set -euo pipefail

          IMAGE="${IN_CONTAINER:-all}"
          VF="${IN_VERSION:-}"
          VA="${IN_VARIANT:-}"

          IMAGES=()
          if [ "$IMAGE" = "all" ] || [ -z "$IMAGE" ]; then
            for d in galalem/*/; do
              [ -f "${d}versions.json" ] && IMAGES+=("$(basename "$d")")
            done
          else
            [ -f "galalem/$IMAGE/versions.json" ] || { echo "no versions.json for $IMAGE"; exit 1; }
            IMAGES=("$IMAGE")
          fi

          MATRIX='[]'
          for img in "${IMAGES[@]}"; do
            VJSON="galalem/$img/versions.json"
            LATEST_VER=$(jq -r 'to_entries[] | select(.value.latest == true) | .key' "$VJSON" | head -1)
            for ver in $(jq -r 'keys[]' "$VJSON"); do
              [ -n "$VF" ] && [ "$VF" != "$ver" ] && continue
              DEFV=$(jq -r --arg v "$ver" '.[$v].default_variant' "$VJSON")
              for var in $(jq -r --arg v "$ver" '.[$v].variants[]' "$VJSON"); do
                [ -n "$VA" ] && [ "$VA" != "$var" ] && continue
                TAGS=("${ver}-${var}")
                [ "$var" = "$DEFV" ] && TAGS+=("$ver")
                if [ "$ver" = "$LATEST_VER" ]; then
                  TAGS+=("$var")
                  [ "$var" = "$DEFV" ] && TAGS+=("latest")
                fi
                TAGCSV=$(IFS=,; echo "${TAGS[*]}")
                ENTRY=$(jq -nc \
                  --arg image "$img" --arg version "$ver" --arg variant "$var" \
                  --arg dockerfile "galalem/$img/$ver/$var/Dockerfile" \
                  --arg context "galalem/$img" \
                  --arg tags "$TAGCSV" \
                  '{image:$image, version:$version, variant:$variant, dockerfile:$dockerfile, context:$context, tags:$tags}')
                MATRIX=$(jq -c ". += [$ENTRY]" <<< "$MATRIX")
              done
            done
          done

          COUNT=$(jq 'length' <<< "$MATRIX")
          echo "Resolved $COUNT build(s):"
          jq -r '.[] | "  galalem/\(.image):[\(.tags)] <- \(.dockerfile)"' <<< "$MATRIX"

          if [ "$COUNT" = "0" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    if: needs.matrix.outputs.empty == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - id: fmt
        name: Format tag list
        env:
          IMAGE: galalem/${{ matrix.image }}
          TAG_CSV: ${{ matrix.tags }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            IFS=',' read -ra A <<< "$TAG_CSV"
            for t in "${A[@]}"; do echo "${IMAGE}:${t}"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.fmt.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.version }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.version }}-${{ matrix.variant }}
